name: Sonda inicial
on:
  push:
    paths: ['.github/workflows/sonda.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar el diseño de la página
        run: |
          mkdir -p sonda/fuente
          B=https://4be3037d-26bc-44d3-8402-ecf34e00a19b.frame.claudeusercontent.com
          for p in project/Main.dc.html project/canvas.json; do
            curl -sSL --max-time 60 -A "Mozilla/5.0" -o "sonda/fuente/$(basename $p)" -w "$p %{http_code} %{content_type} %{size_download}\n" "$B/$p" || echo "$p FALLO"
          done | tee sonda/fuente/log.txt
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A sonda
          git commit -m "Sonda: diseño de la página" || true
          git push
